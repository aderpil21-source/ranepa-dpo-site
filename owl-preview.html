<title>Превью профессиональной совы</title>
<style>
:root{--red:#ca0f3e;--bg:#0b1a3d;--text:#f5f7fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071126;color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;min-height:100vh}
.stage{position:relative;width:min(980px,100vw);height:min(650px,100vh);overflow:hidden;background:
radial-gradient(circle at 70% 15%,rgba(36,75,145,.22),transparent 30%),
linear-gradient(145deg,#101c3f,#061128 72%);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.stage:before{content:"ДПО · РАНХиГС";position:absolute;top:-20px;left:-30px;font-size:105px;font-weight:900;letter-spacing:.02em;color:rgba(255,255,255,.035);white-space:nowrap}
.bubble{position:absolute;top:76px;left:50%;transform:translateX(-50%);padding:20px 34px;border:2px solid var(--red);border-radius:24px 24px 24px 2px;background:rgba(7,16,37,.72);backdrop-filter:blur(12px);font-weight:800;font-size:clamp(18px,2.2vw,28px);white-space:nowrap}
.branch{position:absolute;left:8%;right:-3%;bottom:82px;height:92px;filter:drop-shadow(0 24px 20px rgba(0,0,0,.5))}
.owl{position:absolute;left:34%;bottom:104px;width:210px;height:286px;transform-origin:50% 90%;animation:breath 6.8s ease-in-out infinite}
.owl img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 18px 20px rgba(0,0,0,.62));transform-origin:50% 31%;animation:focus 12s cubic-bezier(.45,0,.2,1) infinite}
.blink{position:absolute;top:55px;width:30px;height:18px;border-radius:55%;background:linear-gradient(#654527,#8e6640 48%,#55371e);opacity:0;transform-origin:50% 0;animation:blink 7.6s ease-in-out infinite;pointer-events:none}
.bl{left:59px}.br{right:59px;animation-delay:.045s}
.note{position:absolute;left:30px;bottom:26px;color:#a8b7d7;font-size:14px;opacity:.9}
@keyframes breath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.008)}}
@keyframes focus{0%,20%,100%{transform:rotate(0)}35%,46%{transform:rotate(-1.35deg) translateX(-1px)}58%,70%{transform:rotate(1.15deg) translateX(1px)}82%{transform:rotate(-.45deg)}}
@keyframes blink{0%,91%,100%{opacity:0;transform:scaleY(.06)}92%{opacity:.15;transform:scaleY(.15)}93.2%,94.4%{opacity:.96;transform:scaleY(1)}96%{opacity:.2;transform:scaleY(.18)}97%{opacity:0;transform:scaleY(.06)}}
@media(max-width:650px){.stage{border-radius:0;height:100vh}.bubble{top:54px;max-width:88%;white-space:normal;text-align:center;padding:14px 18px}.owl{left:50%;transform:translateX(-50%);width:176px;height:240px;bottom:115px}.branch{left:0;right:-20%;bottom:88px}.note{font-size:12px;left:18px}}
@media(prefers-reduced-motion:reduce){.owl,.owl img,.blink{animation:none!important}}
</style>
</head>
