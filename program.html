<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; media-src 'self' blob: https:; frame-src https:; child-src 'self' blob: https:; worker-src 'self' blob:; form-action 'self' https:; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Программа ДПО | Западный филиал РАНХиГС</title>
  <meta name="description" content="Подробная информация о программе дополнительного профессионального образования Западного филиала РАНХиГС.">
  <style>
    :root {
      --bg:#07101f;
      --surface:#0d1729;
      --surface2:#111e33;
      --text:#f5f7fb;
      --muted:#a9b3c4;
      --border:rgba(255,255,255,.11);
      --red:#ca0f3e;
      --red2:#9f0b31;
      --blue:#38bdf8;
      --shadow:0 24px 70px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:linear-gradient(180deg,#07101f 0%,#0a1220 45%,#070d18 100%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.65}
    a{color:inherit}
    .wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}
    header{position:sticky;top:0;z-index:20;background:rgba(7,16,31,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .topbar{min-height:74px;display:flex;align-items:center;gap:18px;justify-content:space-between}
    .brand{text-decoration:none;font-weight:800;letter-spacing:.02em}
    .brand small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .lang{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .lang button{border:0;background:transparent;color:var(--muted);padding:9px 12px;font-weight:800;cursor:pointer}
    .lang button.active{background:var(--red);color:#fff}
    .back{border:1px solid var(--border);padding:9px 13px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:700}
    main{padding:46px 0 80px}
    .hero{padding:34px;border:1px solid var(--border);border-radius:28px;background:radial-gradient(circle at top right,rgba(202,15,62,.2),transparent 38%),var(--surface);box-shadow:var(--shadow)}
    .eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#fff;margin-bottom:15px}
    .badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(202,15,62,.16);border:1px solid rgba(202,15,62,.38);font-size:.85rem;font-weight:800}
    h1{font-size:clamp(2rem,5vw,4rem);line-height:1.06;margin:0 0 18px;letter-spacing:-.035em}
    .lead{font-size:1.15rem;color:#d8deea;max-width:900px;margin:0}
    .meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
    .meta-card{padding:16px;border-radius:17px;background:rgba(255,255,255,.035);border:1px solid var(--border)}
    .meta-label{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
    .meta-value{font-weight:800}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;margin-top:24px}
    .content{display:flex;flex-direction:column;gap:18px}
    .section{padding:26px;border-radius:22px;background:var(--surface);border:1px solid var(--border)}
    .section h2{font-size:1.35rem;margin:0 0 13px}
    .section p{margin:0;color:#d9dfeb;white-space:pre-line}
    .section ul,.section ol{margin:0;padding-left:22px;color:#d9dfeb}
    .section li+li{margin-top:8px}
    .topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;list-style:none!important;padding:0!important}
    .topic-grid li{margin:0!important;padding:13px 14px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025)}
    .side{display:flex;flex-direction:column;gap:14px}
    .side-card{padding:20px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);position:sticky;top:94px}
    .cta{display:block;width:100%;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:13px 16px;border-radius:13px;border:0;font:inherit;font-weight:900;margin-top:14px;cursor:pointer}
    .enroll-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,23,.82);backdrop-filter:blur(8px)}
    .enroll-overlay.active{display:flex}
    .enroll-box{position:relative;width:min(560px,100%);max-height:min(760px,calc(100vh - 40px));overflow:auto;padding:28px;border-radius:24px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
    .enroll-box h2{margin:0 42px 8px 0;font-size:1.55rem}
    .enroll-box p{color:var(--muted)}
    .enroll-close{position:absolute;right:16px;top:14px;width:38px;height:38px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.04);color:var(--text);font-size:1.35rem;cursor:pointer}
    .enroll-program{padding:12px 14px;border-radius:14px;background:rgba(202,15,62,.1);border:1px solid rgba(202,15,62,.28);color:var(--text)!important;font-weight:800}
    .enroll-consent{display:flex;gap:10px;align-items:flex-start;margin:18px 0;color:var(--text);font-size:.92rem}
    .enroll-consent input{margin-top:4px}
    .enroll-option{display:block;margin-top:10px;padding:13px 15px;border-radius:13px;text-align:center;text-decoration:none;font-weight:850;border:1px solid var(--border);background:rgba(255,255,255,.035)}
    .enroll-option.primary{background:linear-gradient(135deg,var(--red),var(--red2));border-color:transparent;color:#fff}
    .enroll-option.disabled{opacity:.42;pointer-events:none}
    .enroll-policy{font-size:.8rem!important;line-height:1.5}
    body.modal-open{overflow:hidden}
    .secondary{display:block;text-align:center;text-decoration:none;border:1px solid var(--border);padding:12px 16px;border-radius:13px;font-weight:800;margin-top:9px}
    .status{padding:18px;border-radius:18px;border:1px dashed var(--border);color:var(--muted);background:rgba(255,255,255,.02)}
    .related-section{margin-top:28px;padding:28px;border-radius:24px;background:linear-gradient(145deg,rgba(202,15,62,.10),rgba(56,189,248,.05)),var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
    .related-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}
    .related-head h2{margin:0;font-size:1.55rem}
    .related-head p{margin:5px 0 0;color:var(--muted);max-width:720px}
    .related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .related-card{display:flex;flex-direction:column;min-height:250px;padding:18px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--border);text-decoration:none;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
    .related-card:hover{transform:translateY(-4px);border-color:rgba(202,15,62,.72);box-shadow:0 18px 40px rgba(0,0,0,.22)}
    .related-type{font-size:.76rem;font-weight:850;color:#ff6b8e;margin-bottom:8px}
    .related-title{font-weight:900;font-size:1.05rem;line-height:1.3;margin-bottom:9px}
    .related-desc{color:var(--muted);font-size:.88rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
    .related-meta{display:flex;flex-wrap:wrap;gap:7px 10px;margin-top:auto;padding-top:16px;color:#dfe7f3;font-size:.8rem;font-weight:750}
    .related-open{display:inline-block;margin-top:12px;color:#fff;font-weight:900;font-size:.84rem}
    .loading,.error{padding:60px 0;text-align:center;color:var(--muted)}
    .error h1{font-size:2rem;color:var(--text)}
    footer{padding:28px 0 48px;color:var(--muted);border-top:1px solid var(--border)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.side-card{position:static}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.related-grid{grid-template-columns:1fr}}
    @media(max-width:620px){.wrap{width:min(100% - 20px,1180px)}.topbar{padding:10px 0}.hero{padding:22px;border-radius:20px}.meta{grid-template-columns:1fr}.section{padding:20px}.topic-grid{grid-template-columns:1fr}.back span{display:none}}
  </style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <a class="brand" href="index.html"><span id="brandName">РАНХиГС</span><small id="brandSub">Западный филиал • Центр дополнительного образования</small></a>

</header>

<main class="wrap">

  <div id="page" hidden>

        <div class="meta-card"><span class="meta-label" id="periodLabel"></span><span class="meta-value" id="period"></span></div>
      </div>

    <div class="layout">
      <div class="content">
        <section class="section" id="aboutSection"><h2 id="aboutLabel"></h2><p id="about"></p></section>
        <section class="section" id="audienceSection"><h2 id="audienceLabel"></h2><p id="audience"></p></section>
        <section class="section" id="goalSection"><h2 id="goalLabel"></h2><p id="goal"></p></section>
        <section class="section" id="outcomesSection"><h2 id="outcomesLabel"></h2><ul id="outcomes"></ul></section>

          <button class="cta" id="applyLink" type="button" onclick="openEnrollModal()"></button>
          <a class="secondary" id="catalogLink" href="index.html#programsSection"></a>

          <p id="relatedIntro">Похожие программы по тематике, формату и объёму обучения.</p>
        </div>
      </div>
      <div class="related-grid" id="relatedGrid"></div>
    </section>
  </div>
</main>

<footer><div class="wrap" id="footerText">Западный филиал РАНХиГС • Центр дополнительного образования</div></footer>

<div class="enroll-overlay" id="enrollModal" role="dialog" aria-modal="true" aria-labelledby="enrollTitle" onclick="if(event.target===this) closeEnrollModal()">
  <div class="enroll-box">
    <button class="enroll-close" id="enrollClose" type="button" onclick="closeEnrollModal()" aria-label="Закрыть">×</button>
    <h2 id="enrollTitle"></h2>
    <p class="enroll-program" id="enrollProgram"></p>
    <p id="enrollIntro"></p>
    <label class="enroll-consent">
      <input type="checkbox" id="enrollConsent" checked onchange="toggleEnrollOptions()">
      <span id="enrollConsentText"></span>
    </label>
    <a class="enroll-option primary" id="enrollTrud" href="https://trudvsem.ru/?region=3900000000000" target="_blank" rel="noopener noreferrer"></a>
    <a class="enroll-option" id="enrollYandex" href="https://forms.yandex.ru" target="_blank" rel="noopener noreferrer"></a>
    <p class="enroll-policy" id="enrollPolicy"></p>
  </div>
</div>

<script>
const qs=new URLSearchParams(location.search);
const programId=(qs.get('id')||'').trim();
let currentLang=qs.get('lang')==='en'?'en':'ru';
let program=null;
let allPrograms=[];
let siteVisibility={};
let siteContentOverrides={};
const SITE_SETTINGS_ID='__site_admin_settings__';
const SITE_ADMIN_API='https://script.google.com/macros/s/AKfycbxCqcmGgAhHU3dG7ClzCjJZpELqpF-ic9H_Qg49BysA30Ybl4khxnwPOS7Pj9gE3g9I/exec';

const ui={
  ru:{
    brandName:'РАНХиГС',pageTitle:'Программа ДПО | Западный филиал РАНХиГС',
    brand:'Западный филиал • Центр дополнительного образования',
    back:'К программам',loading:'Загрузка программы…',notFound:'Программа не найдена',
    notFoundText:'Проверьте ссылку или вернитесь в каталог программ.',
    price:'Стоимость',hours:'Объём',format:'Формат обучения',period:'Срок / даты',
    about:'О программе',audience:'Для кого',goal:'Цель программы',outcomes:'Результаты обучения',
    topics:'Содержание программы',document:'Документ по итогам обучения',experts:'Эксперты и преподаватели',
    official:'Официальное описание',sideTitle:'Хотите узнать условия набора?',
    sideText:'Вернитесь в каталог, чтобы оставить заявку или связаться с Центром дополнительного образования.',
    apply:'Записаться на программу',catalog:'Вернуться в каталог',
    enrollTitle:'Оформление заявки',enrollIntro:'Выберите удобный способ регистрации на выбранную программу.',
    enrollSelected:'Вы выбрали:',enrollConsent:'Даю согласие на обработку персональных данных.',
    enrollTrud:'Записаться через «Работа России» (Калининград)',enrollYandex:'Записаться через Яндекс.Форму',
    enrollPolicy:'Переход к сервису регистрации откроется в новой вкладке. Условия обработки данных применяются в соответствии с политиками РАНХиГС и выбранного сервиса.',
    enrollClose:'Закрыть окно',
    preparing:'Подробная информация по этой программе ещё сверяется с официальными источниками. Короткое описание и основные параметры уже доступны.',
    relatedTitle:'Вас также может заинтересовать',
    relatedIntro:'Три похожие программы по тематике, типу, объёму и стоимости.',
    relatedOpen:'Открыть программу →',
    footer:'Западный филиал РАНХиГС • Центр дополнительного образования'
  },
  en:{
    brandName:'RANEPA',pageTitle:'Continuing Education Program | RANEPA Western Branch',
    brand:'Western Branch • Center for Continuing Professional Education',
    back:'Back to programs',loading:'Loading program…',notFound:'Program not found',
    notFoundText:'Please check the link or return to the program catalogue.',
    price:'Tuition fee',hours:'Duration',format:'Study format',period:'Study period / dates',
    about:'About the program',audience:'Who the program is for',goal:'Program objective',outcomes:'Learning outcomes',
    topics:'Program curriculum',document:'Qualification document',experts:'Experts and instructors',
    official:'Official program description',sideTitle:'Would you like to discuss enrolment?',
    sideText:'Return to the catalogue to submit an application or contact the Center for Continuing Professional Education.',
    apply:'Apply for the program',catalog:'Back to catalogue',
    enrollTitle:'Application',enrollIntro:'Choose a convenient registration method for the selected program.',
    enrollSelected:'Selected program:',enrollConsent:'I consent to the processing of my personal data.',
    enrollTrud:'Apply via “Work in Russia” (Kaliningrad)',enrollYandex:'Apply via Yandex Forms',
    enrollPolicy:'The registration service will open in a new tab. Personal data is processed under the applicable RANEPA and selected service policies.',
    enrollClose:'Close dialog',
    preparing:'Detailed information for this program is still being verified against official source documents. The short description and core program details are already available.',
    relatedTitle:'You may also be interested in',
    relatedIntro:'Three similar programs based on topic, type, duration, and tuition.',
    relatedOpen:'Open program →',
    footer:'RANEPA Western Branch • Center for Continuing Professional Education'
  }
};

function truthyActive(value){return value!==false&&String(value).toUpperCase()!=='FALSE';}
function splitPipe(value){return String(value||'').split('|').map(s=>s.trim()).filter(Boolean);}
function splitOutcomes(value){return String(value||'').split(/;\s*/).map(s=>s.trim()).filter(Boolean);}
function hasDetailedData(p){
  return !!(p&&(p.long_desc_ru||p.long_desc_en||p.audience_ru||p.audience_en||p.goal_ru||p.goal_en||p.outcomes_ru||p.outcomes_en||p.topics_ru||p.topics_en||p.official_desc_ru||p.official_desc_en));
}
async function getJson(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function findProgram(data){
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.programs)?data.programs:[]);
  return arr.find(p=>String(p.id||'')===programId&&truthyActive(p.active))||null;
}
async function loadSiteSettings(){
  try{
    const data=await getJson(SITE_ADMIN_API+'?type=news&_sitecfg='+Date.now());
    const items=data&&Array.isArray(data.items)?data.items:[];
    const item=items.find(n=>n&&n.id===SITE_SETTINGS_ID);
    if(!item) return {visibility:{},content:{}};
    const parsed=JSON.parse(item.lead||'{}');
    return {
      visibility: parsed&&parsed.visibility&&typeof parsed.visibility==='object'?parsed.visibility:{},
      content: parsed&&parsed.content&&typeof parsed.content==='object'?parsed.content:{}
    };
  }catch(e){
    return {visibility:{},content:{}};
  }
}
function siteOverride(key){
  const record=siteContentOverrides&&siteContentOverrides[key];
  if(!record||typeof record!=='object') return '';
  return Object.prototype.hasOwnProperty.call(record,currentLang)?String(record[currentLang]):'';
}
async function loadProgram(){
  const bucket=Math.floor(Date.now()/(5*60*1000));
  let local=null;
  try{local=findProgram(await getJson('./program-data.json?v='+bucket));}catch(e){}
  if(local&&hasDetailedData(local)) return local;
  try{
    const portal=findProgram(await getJson('./portal-data.json?v='+bucket));
    if(portal&&hasDetailedData(portal)) return portal;
    if(!local&&portal) local=portal;
  }catch(e){}
  return local;
}

async function loadProgramCatalog(){
  const bucket=Math.floor(Date.now()/(5*60*1000));
  try{
    const data=await getJson('./portal-data.json?v='+bucket);
    const arr=Array.isArray(data)?data:(data&&Array.isArray(data.programs)?data.programs:[]);
    return arr.filter(p=>truthyActive(p.active));
  }catch(e){
    return [];
  }
}

function metaValue(value,lang){
  const s=String(value||'').trim();
  if(lang==='ru') return s||'—';
  const exact={
    'По запросу':'On request','Повышение квалификации':'Advanced training',
    'Проф. переподготовка':'Professional retraining','Проф. обучение':'Vocational training',
    'Семинар':'Seminar','Очная':'In-person','Очно-заочная':'Blended',
    'Очно-заочная с применением ЭО и ДОТ':'Blended, with e-learning and distance learning technologies',
    'Очно-заочная (с применением ЭО и ДОТ)':'Blended, with e-learning and distance learning technologies',
    'Очно с применением ДОТ':'In-person, with distance learning technologies',
    'Уточняется':'To be confirmed',
    'По мере формирования групп':'As groups are formed','1 месяц':'1 month','2 месяца':'2 months',
    '2,5 месяца':'2.5 months','1,5 месяца':'1.5 months','1,5 – 2 недели':'1.5–2 weeks',
    '1 - 2 дня':'1–2 days','10 недель':'10 weeks'
  };
  if(exact[s]) return exact[s];
  return s.replace(/\bч\.?\b/gi,'hrs').replace(/ч\./gi,'hrs');
}
function field(base){
  if(!program) return '';
  if(base==='title'||base==='desc'){
    const over=siteOverride('i18n:'+program.id+'_'+base);
    if(over) return over;
  }
  const detailed=siteOverride('programdetail:'+program.id+':'+base);
  if(detailed) return detailed;
  const key=base+'_'+currentLang;
  return String(program[key]||'').trim();
}
function localizedMeta(base){
  if(!program) return '—';
  const over=siteOverride('programmeta:'+program.id+':'+base);
  if(over) return over;
  if(currentLang==='en'){
    const exact=String(program[base+'_en']||'').trim();
    return exact||metaValue(program[base],'en');
  }
  return String(program[base]||'').trim()||'—';
}
function setSection(id,value,renderer){
  const section=document.getElementById(id+'Section');
  if(!section) return;
  if(!value){section.hidden=true;return;}
  section.hidden=false;
  renderer(value);
}
function updateEnrollModalText(){
  const t=ui[currentLang];
  const title=program ? (field('title') || program.title_ru || program.title_en || program.id) : '';
  document.getElementById('enrollTitle').textContent=t.enrollTitle;
  document.getElementById('enrollIntro').textContent=t.enrollIntro;
  document.getElementById('enrollProgram').textContent=t.enrollSelected+' '+title;
  document.getElementById('enrollConsentText').textContent=t.enrollConsent;
  document.getElementById('enrollTrud').textContent=t.enrollTrud;
  document.getElementById('enrollYandex').textContent=t.enrollYandex;
  document.getElementById('enrollPolicy').textContent=t.enrollPolicy;
  document.getElementById('enrollClose').setAttribute('aria-label',t.enrollClose);
}
function toggleEnrollOptions(){
  const enabled=document.getElementById('enrollConsent').checked;
  ['enrollTrud','enrollYandex'].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.toggle('disabled',!enabled);
    el.setAttribute('aria-disabled',enabled?'false':'true');
  });
}
function openEnrollModal(){
  updateEnrollModalText();
  toggleEnrollOptions();
  document.getElementById('enrollModal').classList.add('active');
  document.body.classList.add('modal-open');
}
function closeEnrollModal(){
  document.getElementById('enrollModal').classList.remove('active');
  document.body.classList.remove('modal-open');
}
document.addEventListener('keydown',event=>{
  if(event.key==='Escape') closeEnrollModal();
});
function setLanguage(lang){
  currentLang=lang==='en'?'en':'ru';
  document.documentElement.lang=currentLang;
  document.getElementById('ruBtn').classList.toggle('active',currentLang==='ru');
  document.getElementById('enBtn').classList.toggle('active',currentLang==='en');
  const u=new URL(location.href);
  u.searchParams.set('lang',currentLang);
  history.replaceState(null,'',u);
  render();
}
function relatedNormalize(value){
  return String(value||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9\s-]/gi,' ').replace(/\s+/g,' ').trim();
}
function relatedWords(value){
  const stop=new Set(['для','или','при','что','это','как','курс','программа','обучение','повышение','квалификации','профессиональная','профессиональной']);
  return relatedNormalize(value).split(' ').filter(w=>w.length>3&&!stop.has(w));
}
function relatedNumber(value){
  const n=parseInt(String(value||'').replace(/[^\d]/g,''),10);
  return Number.isFinite(n)?n:0;
}
function findRelatedPrograms(source,limit){
  if(!source) return [];
  const sourceWords=new Set(relatedWords(
    (source.title_ru||'')+' '+(source.desc_ru||'')+' '+(Array.isArray(source.bullets_ru)?source.bullets_ru.join(' '):'')
  ));
  const sourceHours=relatedNumber(source.hours);
  const sourcePrice=relatedNumber(source.price);

  return allPrograms
    .filter(p=>p&&String(p.id||'')!==String(source.id||''))
    .filter(p=>siteVisibility['program:'+p.id]!==false)
    .filter(p=>relatedNormalize(p.title_ru||'')!==relatedNormalize(source.title_ru||''))
    .map(p=>{
      let score=0;
      if(p.type&&source.type&&relatedNormalize(p.type)===relatedNormalize(source.type)) score+=8;
      if(p.sector&&source.sector&&p.sector===source.sector) score+=7;
      if(p.tab&&source.tab&&p.tab===source.tab) score+=4;

      relatedWords(
        (p.title_ru||'')+' '+(p.desc_ru||'')+' '+(Array.isArray(p.bullets_ru)?p.bullets_ru.join(' '):'')
      ).forEach(w=>{if(sourceWords.has(w)) score+=1.4;});

      const h=relatedNumber(p.hours);
      if(sourceHours&&h){
        const d=Math.abs(h-sourceHours)/Math.max(h,sourceHours);
        if(d<.15) score+=3; else if(d<.35) score+=1.5;
      }

      const price=relatedNumber(p.price);
      if(sourcePrice&&price){
        const d=Math.abs(price-sourcePrice)/Math.max(price,sourcePrice);
        if(d<.18) score+=2; else if(d<.4) score+=1;
      }

      return {p,score};
    })
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,limit||3)
    .map(x=>x.p);
}
function relatedText(program,field){
  if(currentLang==='en'){
    const en=String(program[field+'_en']||'').trim();
    if(en) return en;
  }
  return String(program[field]||program[field+'_ru']||'').trim();
}
function renderRelated(){
  const section=document.getElementById('relatedSection');
  const grid=document.getElementById('relatedGrid');
  if(!section||!grid||!program){return;}

  const t=ui[currentLang];
  document.getElementById('relatedTitle').textContent=t.relatedTitle;
  document.getElementById('relatedIntro').textContent=t.relatedIntro;

  const items=findRelatedPrograms(program,3);
  if(!items.length){section.hidden=true;grid.replaceChildren();return;}

  grid.replaceChildren();
  items.forEach(item=>{
    const a=document.createElement('a');
    a.className='related-card';
    a.href='program.html?id='+encodeURIComponent(item.id)+'&lang='+encodeURIComponent(currentLang);

    const type=document.createElement('span');
    type.className='related-type';
    type.textContent=metaValue(item.type,currentLang);

    const title=document.createElement('span');
    title.className='related-title';
    title.textContent=currentLang==='en'?(item.title_en||item.title_ru):(item.title_ru||item.title_en);

    const desc=document.createElement('span');
    desc.className='related-desc';
    desc.textContent=currentLang==='en'?(item.desc_en||item.desc_ru):(item.desc_ru||item.desc_en);

    const meta=document.createElement('span');
    meta.className='related-meta';
    const priceMeta=document.createElement('span');
    priceMeta.textContent='💰 '+metaValue(item.price,currentLang);
    const hoursMeta=document.createElement('span');
    hoursMeta.textContent='⏱ '+metaValue(item.hours,currentLang);
    meta.append(priceMeta,hoursMeta);

    const open=document.createElement('span');
    open.className='related-open';
    open.textContent=t.relatedOpen;

    a.append(type,title,desc,meta,open);
    grid.appendChild(a);
  });

  section.hidden=false;
}

function render(){
  const t=ui[currentLang];
  document.getElementById('brandName').textContent=t.brandName;
  document.getElementById('brandSub').textContent=t.brand;
  if(!program) document.title=t.pageTitle;
  document.getElementById('backText').textContent=t.back;
  document.getElementById('footerText').textContent=t.footer;
  document.getElementById('priceLabel').textContent=t.price;
  document.getElementById('hoursLabel').textContent=t.hours;
  document.getElementById('formatLabel').textContent=t.format;
  document.getElementById('periodLabel').textContent=t.period;
  document.getElementById('aboutLabel').textContent=t.about;
  document.getElementById('audienceLabel').textContent=t.audience;
  document.getElementById('goalLabel').textContent=t.goal;
  document.getElementById('outcomesLabel').textContent=t.outcomes;
  document.getElementById('topicsLabel').textContent=t.topics;
  document.getElementById('documentLabel').textContent=t.document;
  document.getElementById('expertsLabel').textContent=t.experts;
  document.getElementById('officialLabel').textContent=t.official;
  document.getElementById('sideTitle').textContent=t.sideTitle;
  document.getElementById('sideText').textContent=t.sideText;
  document.getElementById('applyLink').textContent=t.apply;
  document.getElementById('catalogLink').textContent=t.catalog;
  document.getElementById('backLink').href='index.html?lang='+currentLang+'#programsSection';
  document.getElementById('catalogLink').href='index.html?lang='+currentLang+'#programsSection';
  updateEnrollModalText();
  document.getElementById('ruBtn').classList.toggle('active',currentLang==='ru');
  document.getElementById('enBtn').classList.toggle('active',currentLang==='en');

  if(!program) return;
  const title=field('title')||(currentLang==='en'?'Program':(program.title_ru||program.title_en||program.id));
  const lead=field('desc');
  document.title=title+' | RANEPA';
  document.getElementById('title').textContent=title;
  document.getElementById('lead').textContent=lead||(currentLang==='ru'?'Описание уточняется.':'Description is being prepared.');
  document.getElementById('typeBadge').textContent=localizedMeta('type');
  document.getElementById('price').textContent=localizedMeta('price');
  document.getElementById('hours').textContent=localizedMeta('hours');
  document.getElementById('format').textContent=localizedMeta('format');
  document.getElementById('period').textContent=localizedMeta('dates');

  setSection('about',field('long_desc')||field('desc'),v=>document.getElementById('about').textContent=v);
  setSection('audience',field('audience'),v=>document.getElementById('audience').textContent=v);
  setSection('goal',field('goal'),v=>document.getElementById('goal').textContent=v);
  setSection('outcomes',field('outcomes'),v=>{
    const el=document.getElementById('outcomes');el.replaceChildren();
    splitOutcomes(v).forEach(x=>{const li=document.createElement('li');li.textContent=x;el.appendChild(li);});
  });
  setSection('topics',field('topics')||((program['bullets_'+currentLang]||[])),v=>{
    const el=document.getElementById('topics');el.replaceChildren();
    const items=Array.isArray(v)?v:splitPipe(v);
    items.forEach(x=>{const li=document.createElement('li');li.textContent=x;el.appendChild(li);});
  });
  setSection('document',field('document'),v=>document.getElementById('document').textContent=v);
  setSection('experts',field('teachers')||field('experts'),v=>document.getElementById('experts').textContent=v);
  setSection('official',field('official_desc'),v=>document.getElementById('official').textContent=v);

  const complete=currentLang==='ru'
    ? !!(program.long_desc_ru&&program.goal_ru&&program.topics_ru)
    : !!(program.long_desc_en&&program.goal_en&&program.topics_en);
  const note=document.getElementById('detailNote');
  note.hidden=complete;
  note.textContent=t.preparing;
  renderRelated();
}
async function init(){
  const state=document.getElementById('state');
  state.textContent=ui[currentLang].loading;
  render();
  if(!programId){
    state.className='error';
    state.replaceChildren();
    const h=document.createElement('h1');
    h.textContent=ui[currentLang].notFound;
    const p=document.createElement('p');
    p.textContent=ui[currentLang].notFoundText;
    state.append(h,p);
    return;
  }
  const loaded=await Promise.all([loadProgram(),loadSiteSettings(),loadProgramCatalog()]);
  program=loaded[0];
  const settings=loaded[1]||{visibility:{},content:{}};
  allPrograms=loaded[2]||[];
  siteVisibility=settings.visibility||{};
  siteContentOverrides=settings.content||{};
  if(program&&(siteVisibility.programs===false||siteVisibility['program:'+program.id]===false)) program=null;
  if(!program){
    state.className='error';
    state.replaceChildren();
    const h=document.createElement('h1');
    h.textContent=ui[currentLang].notFound;
    const p=document.createElement('p');
    p.textContent=ui[currentLang].notFoundText;
    state.append(h,p);
    return;
  }
  state.hidden=true;
  document.getElementById('page').hidden=false;
  render();
}
init();
</script>
