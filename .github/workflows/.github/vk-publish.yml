name: Publish news to VK

on:
  workflow_dispatch:

  schedule:
    # Каждые 5 минут.
    # GitHub использует UTC.
    - cron: "*/5 * * * *"

  push:
    branches:
      - main
    paths:
      - "vk_poster.py"
      - ".github/workflows/vk-publish.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: vk-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish new news to VK
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow python-dotenv

      - name: Run VK publisher
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
          VK_API_VERSION: "5.199"
        run: |
          python vk_poster.py

      - name: Save publication state
        if: success()
        run: |
          if git diff --quiet -- vk_published.json; then
            echo "Publication state did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vk_published.json
          git commit -m "chore: update VK publication state"
          git push
