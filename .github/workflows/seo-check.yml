name: SEO metadata
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/generate_seo.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/program-seo.test.cjs
