name: Refresh portal data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-portal-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and validate portal data
        shell: bash
        env:
          API_URL: https://script.google.com/macros/s/AKfycbznjvWDxlxxlANkzTCChnvlyEbW3N74vpOEE8pJaccExiXQG7DZU1SghQApDslMNEOk/exec
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          curl             --fail             --silent             --show-error             --location             --retry 2             --retry-delay 2             --connect-timeout 10             --max-time 45             "$API_URL"             --output "$tmp_file"

          python - "$tmp_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("Portal API response is not a JSON object")

          programs = data.get("programs")
          if not isinstance(programs, list) or not programs:
              raise SystemExit("Portal API response has no non-empty programs array")

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          mv "$tmp_file" portal-data.json

      - name: Commit only when data changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- portal-data.json; then
            echo "portal-data.json is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portal-data.json
          git commit -m "data: refresh portal snapshot"
          git push
