name: Refresh public portal snapshots

on:
  push:
    branches:
      - feature/program-detail-pages
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-portal-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and validate portal data
        shell: bash
        env:
          API_URL: https://script.google.com/macros/s/AKfycbznjvWDxlxxlANkzTCChnvlyEbW3N74vpOEE8pJaccExiXQG7DZU1SghQApDslMNEOk/exec
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 45 \
            "$API_URL" \
            --output "$tmp_file"

          python - "$tmp_file" program-data.json portal-data.json schedule-data.json owl-files.json <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          api_path = Path(sys.argv[1])
          program_path = Path(sys.argv[2])
          portal_path = Path(sys.argv[3])
          schedule_path = Path(sys.argv[4])
          owl_path = Path(sys.argv[5])

          data = json.loads(api_path.read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("Portal API response is not a JSON object")

          schedules = data.get("schedules")
          owl_files = data.get("owlFiles")
          current_alert = data.get("currentAlert")

          if not isinstance(schedules, list):
              raise SystemExit("Portal API response has no schedules array")
          if not isinstance(owl_files, list):
              raise SystemExit("Portal API response has no owlFiles array")
          if current_alert is not None and not isinstance(current_alert, dict):
              raise SystemExit("Portal API currentAlert has invalid format")

          now = datetime.now(timezone.utc).isoformat()

          def read_json(path):
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError):
                  return None

          program_snapshot = read_json(program_path)
          if not isinstance(program_snapshot, dict):
              raise SystemExit("program-data.json is missing or invalid")
          programs = program_snapshot.get("programs")
          if not isinstance(programs, list) or not programs:
              raise SystemExit("program-data.json has no non-empty programs array")
          if any(not isinstance(item, dict) or not item.get("id") for item in programs):
              raise SystemExit("program-data.json contains invalid program records")
          ids = [str(item.get("id")) for item in programs]
          if len(ids) != len(set(ids)):
              raise SystemExit("program-data.json contains duplicate program IDs")

          def write_json(path, payload):
              path.write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          portal_payload = {
              "programs": programs,
              "schedules": schedules,
              "owlFiles": owl_files,
              "currentAlert": current_alert,
          }
          current_portal = read_json(portal_path)
          current_portal_payload = None
          if isinstance(current_portal, dict):
              current_portal_payload = {
                  "programs": current_portal.get("programs"),
                  "schedules": current_portal.get("schedules"),
                  "owlFiles": current_portal.get("owlFiles"),
                  "currentAlert": current_portal.get("currentAlert"),
              }
          if current_portal_payload != portal_payload:
              write_json(portal_path, {"generatedAt": now, **portal_payload})
              print("portal-data.json updated")

          current_schedule = read_json(schedule_path)
          if not isinstance(current_schedule, dict) or current_schedule.get("schedules") != schedules:
              write_json(schedule_path, {"generatedAt": now, "schedules": schedules})
              print("schedule-data.json updated")

          current_owl = read_json(owl_path)
          if not isinstance(current_owl, dict) or current_owl.get("owlFiles") != owl_files:
              write_json(owl_path, {"generatedAt": now, "owlFiles": owl_files})
              print("owl-files.json updated")
          PY

          rm -f "$tmp_file"

      - name: Commit only changed snapshots
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- portal-data.json schedule-data.json owl-files.json; then
            echo "Public portal snapshots are already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portal-data.json schedule-data.json owl-files.json
          git commit -m "data: refresh public portal snapshots"
          git push
