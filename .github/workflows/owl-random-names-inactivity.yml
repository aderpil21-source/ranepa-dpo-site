name: Owl random operator names and inactivity

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Trigger Owl random names inactivity')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Owl
        run: python scripts/patch_owl_random_names_inactivity.py

      - name: Validate JavaScript
        run: |
          node --check owl-operator.js
          grep -F 'OWL_RANDOM_OPERATOR_NAMES_V1' owl-operator.js
          grep -F 'OPERATOR_INACTIVITY_MS = 10 * 60 * 1000' owl-operator.js
          grep -F 'function ensureOperatorDisplayName()' owl-operator.js
          grep -F 'endHandoff(true)' owl-operator.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owl-operator.js
          git commit -m "Randomize Owl operator display name and auto-close inactive chats"
          git push origin HEAD:main
