name: Owl random operator names and inactivity

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Trigger Owl inactivity timer fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Owl inactivity timer
        run: python scripts/fix_owl_inactivity_start.py

      - name: Validate JavaScript
        run: |
          node --check owl-operator.js
          grep -F 'OPERATOR_INACTIVITY_MS = 10 * 60 * 1000' owl-operator.js
          grep -F "state.status = 'waiting';" owl-operator.js
          grep -F 'touchOperatorActivity();' owl-operator.js
          grep -F 'endHandoff(true)' owl-operator.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owl-operator.js
          git commit -m "Fix Owl inactivity timer from handoff start"
          git push origin HEAD:main
