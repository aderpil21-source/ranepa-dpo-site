name: VK image document test

on:
  # Диагностический тест VK. Никогда не запускать автоматически по push.
  workflow_dispatch:

jobs:
  test-vk-document:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Test VK document image upload
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
        run: python vk_doc_test.py
