name: Live public data checks
on:
  push:
    branches: [main]
    paths:
      - 'public-data-resilience.js'
      - 'tests/public-data-resilience.test.cjs'
      - '.github/workflows/live-public-api-check.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test failover and public data security
        run: |
          node --test tests/public-data-resilience.test.cjs
          node tests/security-public-snapshots.test.cjs
      - name: Verify live snapshots and material service
        shell: bash
        run: |
          set -euo pipefail
          for file in portal-data schedule-data program-list news-data site-settings portal-alert; do
            curl --fail --silent --show-error --retry 2 --max-time 20 "https://ranepa-dpo39.ru/$file.json" > "/tmp/$file.json"
          done
          python - <<'PY'
          import json
          for name,key in [('portal-data','schedules'),('schedule-data','schedules'),('program-list','programs'),('news-data','items')]:
              data=json.load(open('/tmp/'+name+'.json'))
              assert isinstance(data.get(key),list), name
              assert not data.get('owlFiles'), name
          settings=json.load(open('/tmp/site-settings.json'))['settings']
          assert not any(str(k).startswith('material:') for k in settings.get('visibility',{}))
          assert 'currentAlert' in json.load(open('/tmp/portal-alert.json'))
          PY
          base='https://ranepa-dpo-materials-api.rt9b8frtkg.chatgpt.site'
          curl --fail --silent --show-error --retry 2 --max-time 20 "$base/health" > /tmp/health.json
          python -c "import json; assert json.load(open('/tmp/health.json')).get('ok') is True"
          status="$(curl --silent --show-error --max-time 20 --output /tmp/bad-code.json --write-out '%{http_code}' "$base/material?code=bad")"
          test "$status" = '400'
