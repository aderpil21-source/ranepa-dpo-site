name: Live public API checks

on:
  push:
    branches: [main]
    paths:
      - 'public-api-proxy/**'
      - '.github/workflows/live-public-api-check.yml'
  workflow_dispatch:

jobs:
  live-api:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for safe public API deploy
        shell: bash
        run: |
          set -euo pipefail
          base="https://ranepa-dpo-public-api.onrender.com"
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 20 "$base/health" > /tmp/health.json; then
              python -c "import json; d=json.load(open('/tmp/health.json',encoding='utf-8')); assert d.get('ok') is True"
              exit 0
            fi
            sleep 5
          done
          echo "Public API did not become healthy in time" >&2
          exit 1

      - name: Validate public payloads
        shell: bash
        run: |
          set -euo pipefail
          base="https://ranepa-dpo-public-api.onrender.com"
          for path in portal schedule programs news settings; do
            curl --fail --silent --show-error --max-time 30 "$base/$path" > "/tmp/$path.json"
          done
          status="$(curl --silent --output /tmp/bad-material.json --write-out '%{http_code}' --max-time 20 "$base/material?code=bad")"
          test "$status" = "400"
          python -c "import json; portal=json.load(open('/tmp/portal.json')); schedule=json.load(open('/tmp/schedule.json')); programs=json.load(open('/tmp/programs.json')); news=json.load(open('/tmp/news.json')); settings=json.load(open('/tmp/settings.json')); assert 'owlFiles' not in portal; assert isinstance(portal.get('programs'),list) and portal['programs']; assert isinstance(portal.get('schedules'),list); assert isinstance(schedule.get('schedules'),list); assert isinstance(programs.get('programs'),list) and programs['programs']; assert isinstance(news.get('items'),list); assert all(x.get('status')=='published' for x in news['items']); s=settings.get('settings') or {}; assert not any(str(k).startswith('material:') for k in (s.get('visibility') or {})); print('Live public API checks passed')"
