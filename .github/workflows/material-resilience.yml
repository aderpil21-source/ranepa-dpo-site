name: Material failover availability
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['api/**', 'public-api-proxy/yandex-material.mjs', 'tests/yandex-material.test.mjs', 'tests/public-data-resilience.test.cjs', 'tests/material-failover-browser.test.cjs', 'students.js', 'students.html', 'public-api-proxy/material-server.mjs', 'public-data-resilience.js', 'tests/material-server.test.mjs', '.github/workflows/material-resilience.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/material-server.test.mjs tests/yandex-material.test.mjs
      - run: node tests/public-data-resilience.test.cjs
      - name: Verify independent origins without logging lecture codes
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 25 --output /tmp/yandex-material.json --write-out '%{http_code}' 'https://functions.yandexcloud.net/d4epn9fj3lub5pa30m7u?code=bad')"
          test "$status" = '400'
          python -c "import json; assert json.load(open('/tmp/yandex-material.json')).get('error') == 'bad_code'"
          for base in 'https://ranepa-dpo-site.vercel.app/api' 'https://ranepa-materials-access.onrender.com'; do
            curl --fail --silent --show-error --retry 2 --max-time 80 "$base/health" > /tmp/material-health.json
            python -c "import json; assert json.load(open('/tmp/material-health.json')).get('ok') is True"
            status="$(curl --silent --show-error --max-time 25 --output /tmp/material-code.json --write-out '%{http_code}' "$base/material?code=bad")"
            test "$status" = '400'
          done
          curl --fail --silent --show-error --retry 2 --max-time 25 'https://ranepa-dpo-site.vercel.app/api/health?upstream=1' > /tmp/material-source.json
          python -c "import json; assert json.load(open('/tmp/material-source.json')).get('ok') is True"
  browser-failover:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/material-failover-browser.test.cjs
