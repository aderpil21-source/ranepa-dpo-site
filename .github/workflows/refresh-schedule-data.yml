name: Refresh public schedule

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and validate public schedule
        shell: bash
        env:
          API_URL: https://script.google.com/macros/s/AKfycbznjvWDxlxxlANkzTCChnvlyEbW3N74vpOEE8pJaccExiXQG7DZU1SghQApDslMNEOk/exec
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 45 \
            "$API_URL" \
            --output "$tmp_file"

          python - "$tmp_file" schedule-data.json <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          api_path = Path(sys.argv[1])
          snapshot_path = Path(sys.argv[2])

          data = json.loads(api_path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("Portal API response is not a JSON object")

          schedules = data.get("schedules")
          if not isinstance(schedules, list):
              raise SystemExit("Portal API response has no schedules array")

          current_schedules = None
          if snapshot_path.exists():
              try:
                  current = json.loads(snapshot_path.read_text(encoding="utf-8"))
                  if isinstance(current, dict) and isinstance(current.get("schedules"), list):
                      current_schedules = current["schedules"]
              except (json.JSONDecodeError, OSError):
                  pass

          if current_schedules == schedules:
              print("Schedule is unchanged")
              raise SystemExit(0)

          output = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "schedules": schedules,
          }

          snapshot_path.write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Updated schedule snapshot: {len(schedules)} item(s)")
          PY

          rm -f "$tmp_file"

      - name: Commit only when schedule changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- schedule-data.json; then
            echo "schedule-data.json is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule-data.json
          git commit -m "data: refresh public schedule snapshot"
          git push
