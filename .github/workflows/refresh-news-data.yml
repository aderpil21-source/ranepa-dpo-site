name: Refresh public news

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and validate public news
        shell: bash
        env:
          API_URL: https://script.google.com/macros/s/AKfycbznjvWDxlxxlANkzTCChnvlyEbW3N74vpOEE8pJaccExiXQG7DZU1SghQApDslMNEOk/exec?type=news
        run: |
          set -euo pipefail

          tmp_file="$(mktemp)"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 45 \
            "$API_URL" \
            --output "$tmp_file"

          python - "$tmp_file" news-data.json site-settings.json <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          api_path = Path(sys.argv[1])
          snapshot_path = Path(sys.argv[2])
          settings_path = Path(sys.argv[3])

          data = json.loads(api_path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("News API response is not a JSON object")

          items = data.get("items")
          if not isinstance(items, list):
              raise SystemExit("News API response has no items array")

          settings_item = next(
              (
                  item for item in items
                  if isinstance(item, dict)
                  and item.get("id") == "__site_admin_settings__"
              ),
              None,
          )

          settings = {}
          if settings_item:
              try:
                  raw_settings = settings_item.get("lead") or "{}"
                  parsed_settings = json.loads(raw_settings)
                  if isinstance(parsed_settings, dict):
                      settings = parsed_settings
              except (TypeError, json.JSONDecodeError):
                  settings = {}

          # Public snapshot must contain only data required to render the public site.
          # Never publish access-code visibility keys, drafts/archived CMS entities,
          # or the internal version pointer.
          public_visibility = {
              key: value
              for key, value in (settings.get("visibility") or {}).items()
              if not str(key).startswith("material:")
          }

          def public_entities(name):
              value = settings.get(name)
              if not isinstance(value, list):
                  return []
              return [
                  item for item in value
                  if isinstance(item, dict)
                  and item.get("archived") is not True
                  and item.get("active") is not False
              ]

          public_attributes = {}
          for selector, record in (settings.get("attributes") or {}).items():
              if not isinstance(record, dict):
                  continue
              if record.get("hidden") is True:
                  public_attributes[selector] = {
                      "selector": record.get("selector") or selector,
                      "hidden": True,
                  }
              else:
                  public_attributes[selector] = record

          settings = {
              "version": settings.get("version", 1),
              "visibility": public_visibility,
              "content": settings.get("content") if isinstance(settings.get("content"), dict) else {},
              "attributes": public_attributes,
              "customPrograms": public_entities("customPrograms"),
              "customContacts": public_entities("customContacts"),
              "customFaqs": public_entities("customFaqs"),
              "customSchedules": public_entities("customSchedules"),
              "customNavItems": public_entities("customNavItems"),
              "customDocs": public_entities("customDocs"),
              "customBlocks": public_entities("customBlocks"),
              "theme": settings.get("theme") if isinstance(settings.get("theme"), dict) else {},
              "seo": settings.get("seo") if isinstance(settings.get("seo"), dict) else {},
              "updatedAt": settings.get("updatedAt") or "",
          }

          public_items = [
              item for item in items
              if isinstance(item, dict)
              and item.get("status") == "published"
              and item.get("id") != "__site_admin_settings__"
              and "__site_version__" not in (item.get("tags") or [])
              and "__system__" not in (item.get("tags") or [])
          ]

          current_items = None
          if snapshot_path.exists():
              try:
                  current = json.loads(snapshot_path.read_text(encoding="utf-8"))
                  if isinstance(current, dict) and isinstance(current.get("items"), list):
                      current_items = current["items"]
              except (json.JSONDecodeError, OSError):
                  pass

          current_settings = None
          if settings_path.exists():
              try:
                  current = json.loads(settings_path.read_text(encoding="utf-8"))
                  if isinstance(current, dict) and isinstance(current.get("settings"), dict):
                      current_settings = current["settings"]
              except (json.JSONDecodeError, OSError):
                  pass

          changed = False
          now = datetime.now(timezone.utc).isoformat()

          if current_items != public_items:
              output = {
                  "generatedAt": now,
                  "items": public_items,
              }
              snapshot_path.write_text(
                  json.dumps(output, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              changed = True
              print(f"Updated public snapshot: {len(public_items)} published item(s)")
          else:
              print("Published news are unchanged")

          if current_settings != settings:
              settings_output = {
                  "generatedAt": now,
                  "settings": settings,
              }
              settings_path.write_text(
                  json.dumps(settings_output, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              changed = True
              print("Updated site settings snapshot")
          else:
              print("Site settings are unchanged")

          if not changed:
              raise SystemExit(0)
          PY

          rm -f "$tmp_file"

      - name: Refresh SEO sitemap
        run: python3 scripts/generate_seo.py

      - name: Commit only when public data changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- news-data.json site-settings.json sitemap.xml; then
            echo "Public news and site settings are already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news-data.json site-settings.json sitemap.xml
          git commit -m "data: refresh public site snapshots"
          git push
