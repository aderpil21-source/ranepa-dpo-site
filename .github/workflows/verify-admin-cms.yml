name: Verify Apps Script Admin CMS

on:
  push:
    branches:
      - feature/direct-pro-sheets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed endpoints
        shell: bash
        env:
          API_URL: https://script.google.com/macros/s/AKfycbznjvWDxlxxlANkzTCChnvlyEbW3N74vpOEE8pJaccExiXQG7DZU1SghQApDslMNEOk/exec
        run: |
          set -euo pipefail
          settings="$(curl --fail --silent --show-error --location --max-time 45 "$API_URL?type=siteSettings")"
          protected="$(curl --fail --silent --show-error --location --max-time 45 -H 'Content-Type: text/plain;charset=utf-8' --data '{"action":"adminHistory","token":""}' "$API_URL")"
          python - "$settings" "$protected" <<'PY'
          import json, sys
          settings = json.loads(sys.argv[1])
          protected = json.loads(sys.argv[2])
          assert settings.get("ok") is True, settings
          payload = settings.get("settings")
          assert isinstance(payload, dict), settings
          assert payload.get("version") == 4, settings
          assert isinstance(payload.get("visibility"), dict), settings
          assert isinstance(payload.get("content"), dict), settings
          assert protected.get("ok") is False, protected
          assert protected.get("code") == "SESSION_EXPIRED", protected
          print("ADMIN_CMS_DEPLOYED_OK")
          print("settings version:", payload.get("version"))
          print("protected route:", protected.get("code"))
          PY
