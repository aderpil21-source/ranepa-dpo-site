name: Clean Owl Step Backgrounds

on:
  push:
    branches:
      - feature/owl-v2-realistic
    paths:
      - .github/workflows/import-owl-step-frames.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owl-v2-realistic
          fetch-depth: 0

      - name: Install background-removal tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rembg[cpu]" pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Remove baked backgrounds from owl step frames
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from rembg import remove
          from PIL import Image
          import io

          for n in range(1, 5):
              src = Path(f"img/owl-step-{n}.webp")
              raw = src.read_bytes()
              cut = remove(raw)
              im = Image.open(io.BytesIO(cut)).convert("RGBA")
              # All step assets share the same website canvas.
              im = im.resize((336, 448), Image.Resampling.LANCZOS)
              png = Path(f"/tmp/owl-step-{n}.png")
              im.save(png, "PNG", optimize=True)
              alpha = im.getchannel("A")
              lo, hi = alpha.getextrema()
              if lo >= 255:
                  raise RuntimeError(f"step {n}: no transparency produced")
              print(f"step {n}: alpha range {lo}..{hi}")
          PY

          for n in 1 2 3 4; do
            convert "/tmp/owl-step-${n}.png" -quality 78 "img/owl-step-${n}.webp"
            test "$(identify -format '%w' "img/owl-step-${n}.webp")" = "336"
            test "$(identify -format '%h' "img/owl-step-${n}.webp")" = "448"
            channels="$(identify -format '%[channels]' "img/owl-step-${n}.webp")"
            echo "step ${n}: ${channels}"
            echo "${channels}" | grep -qi 'a'
          done

      - name: Commit transparent owl step frames
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/owl-step-1.webp img/owl-step-2.webp img/owl-step-3.webp img/owl-step-4.webp
          git commit -m "fix: make owl step frames transparent"
          git push
