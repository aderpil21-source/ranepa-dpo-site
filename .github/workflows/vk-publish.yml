name: Publish news to VK

on:
  workflow_dispatch:

  schedule:
    # Проверять сайт каждые 5 минут
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

  push:
    paths:
      - "vk_poster.py"
      - ".github/workflows/vk-publish.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: vk-news-publisher
  cancel-in-progress: false

jobs:
  publish-to-vk:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Получаем репозиторий
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Зависимости
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      # ------------------------------------------------------
      # Публикация
      # ------------------------------------------------------

      - name: Publish news to VK
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_UPLOAD_TOKEN: ${{ secrets.VK_UPLOAD_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
          VK_API_VERSION: "5.199"


        run: |
          python vk_poster.py

      # ------------------------------------------------------
      # Сохраняем состояние опубликованных новостей
      # ------------------------------------------------------

      - name: Save VK publication state
        if: always()
        run: |
          if [ -f vk_published.json ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add vk_published.json

            if ! git diff --cached --quiet; then
              git commit -m "chore: update VK publication state"
              git push
            else
              echo "Изменений в vk_published.json нет."
            fi

          else
            echo "vk_published.json ещё не создан."
          fi