name: Run Owl operator polish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run Owl operator polish workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owl-telegram-operator
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/owl_polish_once.py

      - name: Validate
        run: |
          python -m py_compile operator/app.py
          node --check owl-operator.js
          grep -F 'owl-operator.js?v=20261003-2' index.html
          grep -F '👀 Открыть и ответить' operator/app.py
          grep -F 'WAIT_REASONS' owl-operator.js
          grep -F 'showOperatorTyping' owl-operator.js

      - name: Commit feature changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Owl operator handoff and reply reliability"
          git push origin HEAD:feature/owl-telegram-operator

      - name: Remove trigger from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/owl-polish-main-trigger.yml
          git add -A
          git commit -m "Remove one-shot Owl polish workflow"
          git push origin main
