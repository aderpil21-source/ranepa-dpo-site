name: Fix Owl operator shared state

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Trigger Owl shared-state fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owl-telegram-operator
          fetch-depth: 0

      - name: Patch operator process ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('operator/app.py')
          text = app.read_text(encoding='utf-8')

          old_start = '''def start_telegram_thread():
              global telegram_thread_started
              if telegram_thread_started or not BOT_TOKEN or not OPERATOR_CHAT_ID:
                  return
              telegram_thread_started = True
              threading.Thread(target=telegram_poll_loop, name='telegram-operator', daemon=True).start()


          start_telegram_thread()


          if __name__ == '__main__':
          '''
          new_start = '''def start_telegram_thread():
              global telegram_thread_started
              if not BOT_TOKEN or not OPERATOR_CHAT_ID:
                  return
              with lock:
                  if telegram_thread_started:
                      return
                  telegram_thread_started = True
              logging.info('Starting Owl Telegram polling in pid=%s', os.getpid())
              threading.Thread(target=telegram_poll_loop, name='telegram-operator', daemon=True).start()


          @app.before_request
          def ensure_telegram_polling_in_http_worker():
              # Gunicorn may import application code outside the request-serving worker.
              # Starting the polling thread here guarantees Telegram callbacks and
              # HTTP polling share the same in-memory session/event store.
              start_telegram_thread()


          if __name__ == '__main__':
          '''
          if old_start not in text:
              raise SystemExit('start_telegram_thread block not found')
          text = text.replace(old_start, new_start, 1)

          old_accept = "logging.info('Owl operator accepted session=%s alias=%s', session['short'], name)"
          new_accept = "logging.info('Owl operator accepted session=%s alias=%s pid=%s', session['short'], name, os.getpid())"
          if old_accept not in text:
              raise SystemExit('accept log not found')
          text = text.replace(old_accept, new_accept, 1)

          old_message = "        add_event(session, 'message', text=text[:1800], operator_name=name)\n        user_id = str(((message or {}).get('from') or {}).get('id') or '')"
          new_message = "        event = add_event(session, 'message', text=text[:1800], operator_name=name)\n        logging.info('Owl operator message stored session=%s event=%s pid=%s', session['short'], event.get('id'), os.getpid())\n        user_id = str(((message or {}).get('from') or {}).get('id') or '')"
          if old_message not in text:
              raise SystemExit('operator message event block not found')
          text = text.replace(old_message, new_message, 1)

          old_events = "        events = [e for e in session.get('events', []) if int(e.get('id', 0)) > after]\n        return jsonify({"
          new_events = "        events = [e for e in session.get('events', []) if int(e.get('id', 0)) > after]\n        if events:\n            logging.info('Owl events delivered session=%s after=%s status=%s count=%s pid=%s', session.get('short'), after, session.get('status'), len(events), os.getpid())\n        return jsonify({"
          if old_events not in text:
              raise SystemExit('events block not found')
          text = text.replace(old_events, new_events, 1)
          app.write_text(text, encoding='utf-8')

          js = Path('owl-operator.js')
          s = js.read_text(encoding='utf-8')
          old_js = '''        if (event.type === 'message' && event.text) {
              state.status = 'active';
              saveState();
              announcedActive = true;
              const name = event.operator_name ? event.operator_name : 'Мария';
              if (!announcedActive && typeof window.addBotMsg === 'function') {
                  window.addBotMsg('🟢 <b>Оператор ' + esc(name) + ' подключился.</b>');
              }
              announcedActive = true;
              showOperatorTyping(name, event.text);
          }
          '''
          new_js = '''        if (event.type === 'message' && event.text) {
              const wasAnnounced = announcedActive;
              state.status = 'active';
              saveState();
              const name = event.operator_name ? event.operator_name : 'Мария';
              if (!wasAnnounced && typeof window.addBotMsg === 'function') {
                  window.addBotMsg('🟢 <b>Оператор ' + esc(name) + ' подключился.</b>');
              }
              announcedActive = true;
              showOperatorTyping(name, event.text);
          }
          '''
          if old_js not in s:
              raise SystemExit('frontend message block not found')
          s = s.replace(old_js, new_js, 1)
          js.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m py_compile operator/app.py
          node --check owl-operator.js
          grep -F '@app.before_request' operator/app.py
          grep -F 'Owl operator message stored' operator/app.py
          grep -F 'const wasAnnounced = announcedActive;' owl-operator.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operator/app.py owl-operator.js
          git commit -m "Keep Owl Telegram polling in the HTTP worker"
          git push origin HEAD:feature/owl-telegram-operator
