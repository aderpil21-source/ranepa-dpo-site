name: Import Owl V2 Assets

on:
  push:
    branches:
      - feature/owl-v2-realistic
    paths:
      - .github/workflows/import-owl-v2-assets.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/owl-v2-realistic
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download approved transparent owl frames
        env:
          OPEN_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/d0271fa1-4b09-4578-91be-3c434094a51e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWMxM2UyYWI2NTVlMzk3MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDU2NjA1OX0.NK_qrw6LZ8ptYgCUYX_rr9iYAV-FLu7hTosRtgwufdE"
          CLOSED_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/e56907a7-154f-4f1a-a009-983c3bf05393.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTk3NTdjMWQ0MzY1NmY2NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDU3MzIxM30.05kNR0N8ybeBvVARbJT3R7rDIqfPM8xj1B0TTa5X6m4"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$OPEN_URL" -o /tmp/owl-open.png
          curl --fail --location --retry 3 "$CLOSED_URL" -o /tmp/owl-closed.png

          identify /tmp/owl-open.png
          identify /tmp/owl-closed.png

          convert /tmp/owl-open.png -resize 336x448! -quality 76 img/owl-v2-open.webp
          convert /tmp/owl-closed.png -resize 336x448! -quality 76 img/owl-v2-closed.webp

          identify img/owl-v2-open.webp
          identify img/owl-v2-closed.webp

          test "$(identify -format '%w' img/owl-v2-open.webp)" = "336"
          test "$(identify -format '%h' img/owl-v2-open.webp)" = "448"
          test "$(identify -format '%w' img/owl-v2-closed.webp)" = "336"
          test "$(identify -format '%h' img/owl-v2-closed.webp)" = "448"

      - name: Commit production owl assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/owl-v2-open.webp img/owl-v2-closed.webp
          if git diff --cached --quiet; then
            echo "Assets already match."
            exit 0
          fi
          git commit -m "fix: import valid owl v2 assets"
          git push
