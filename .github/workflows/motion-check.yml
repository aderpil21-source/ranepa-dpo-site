name: Motion browser checks
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'premium-motion.*'
      - 'liquid-glass.css'
      - 'mobile-app.js'
      - 'owl-engine.js'
      - 'public-data-resilience.js'
      - 'tests/owl-material-live-browser.test.cjs'
      - 'tests/mobile-layout-browser.test.cjs'
      - 'assets/vendor/**'
      - 'programs-page.js'
      - 'schedule-page.js'
      - 'tests/motion-browser.test.cjs'
      - 'tests/schedule-overlay-browser.test.cjs'
      - '.github/workflows/motion-check.yml'
  pull_request:
    paths:
      - '*.html'
      - 'premium-motion.*'
      - 'liquid-glass.css'
      - 'mobile-app.js'
      - 'owl-engine.js'
      - 'public-data-resilience.js'
      - 'tests/owl-material-live-browser.test.cjs'
      - 'tests/mobile-layout-browser.test.cjs'
      - 'assets/vendor/**'
      - 'programs-page.js'
      - 'schedule-page.js'
      - 'tests/motion-browser.test.cjs'
      - 'tests/schedule-overlay-browser.test.cjs'
      - '.github/workflows/motion-check.yml'
permissions:
  contents: read
jobs:
  motion-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install chromium
      - run: node tests/owl-material-live-browser.test.cjs
      - run: node tests/schedule-overlay-browser.test.cjs
      - run: node tests/motion-browser.test.cjs
      - run: node tests/mobile-layout-browser.test.cjs
